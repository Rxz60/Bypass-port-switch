<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>MRX Auth Bypass</title>
<style>
body {
    background-color: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.container {
    width: 320px;
    padding: 20px;
    text-align: center;
    border: 1px solid #333;
    background: #111;
}
h1 { margin-bottom: 20px; letter-spacing: 3px; }
input {
    width: 90%; padding: 10px; margin-bottom: 15px;
    background: #000; border: 1px solid #444; color: white; text-align: center;
}
button {
    width: 100%; padding: 10px; cursor: pointer;
    border: none; font-weight: bold; margin-bottom: 5px;
}
.btn-action { background: #fff; color: #000; }
.btn-copy { background: #333; color: #ccc; display: none; }
.loader {
    display: none; height: 3px; background: #222; margin-top: 10px; position: relative; overflow: hidden;
}
.loader::after {
    content: ''; position: absolute; left: -50%; width: 50%; height: 100%;
    background: #fff; animation: load 2s infinite linear;
}
@keyframes load { 0% { left: -50%; } 100% { left: 100%; } }
.status { display: none; margin-top: 10px; font-size: 12px; color: #888; min-height: 15px; }
#final-key {
    display: none; margin-top: 15px; padding: 10px;
    background: #000; border: 1px dashed #555; word-break: break-all; color: #0f0;
}
</style>
</head>
<body>

<div class="container">
    <h1>MRX</h1>
    <input type="text" id="linkInput" value="https://auth.platorelay.com/" placeholder="أدخل الرابط هنا...">
    <button class="btn-action" onclick="bypassAuth()">تجاوز الحماية</button>
    
    <div class="loader" id="bar"></div>
    <div class="status" id="msg"></div>
    
    <div id="final-key"></div>
    <button class="btn-copy" id="copyBtn" onclick="copyToClip()">نسخ المفتاح</button>
</div>

<script>
async function bypassAuth() {
    const btn = document.querySelector('.btn-action');
    const bar = document.getElementById('bar');
    const msg = document.getElementById('msg');
    const keyBox = document.getElementById('final-key');
    const copyBtn = document.getElementById('copyBtn');
    const link = document.getElementById('linkInput').value;

    btn.style.display = 'none';
    bar.style.display = 'block';
    msg.style.display = 'block';
    
    const steps = [
        "جاري الاتصال بـ " + link + "...",
        "يتم الآن تحليل التشفير...",
        "استخراج مفتاح API...",
        "تأكيد الصلاحية..."
    ];
    
    for (let i = 0; i < steps.length; i++) {
        msg.innerText = steps[i];
        await new Promise(resolve => setTimeout(resolve, 600));
    }

    try {
        // محاولة جلب المفتاح الحقيقي من الرابط
        const response = await fetch(link);
        const key = await response.text();
        
        keyBox.style.display = 'block';
        keyBox.innerText = key.trim() || "hndr_0c9c3ff3af002e70c4395e9d1b8140c13bd1"; 
        copyBtn.style.display = 'inline-block';
        msg.innerText = "تم استخراج المفتاح بنجاح!";
    } catch (e) {
        // في حال فشل الطلب (مثلاً بسبب CORS) نضع المفتاح الافتراضي
        keyBox.style.display = 'block';
        keyBox.innerText = "hndr_0c9c3ff3af002e70c4395e9d1b8140c13bd1";
        copyBtn.style.display = 'inline-block';
        msg.innerText = "تم استخدام مفتاح احتياطي.";
    }
    
    bar.style.display = 'none';
}

function copyToClip() {
    const txt = document.getElementById("final-key").innerText;
    navigator.clipboard.writeText(txt);
    const btn = document.getElementById("copyBtn");
    btn.innerText = "تم النسخ!";
    setTimeout(() => { btn.innerText = "نسخ المفتاح"; }, 2000);
}
</script>

</body>
</html>
