<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MRX · بحث سكربتات</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:#000;color:#fff;min-height:100vh;
background-image:url('حط رابط الخلفيه هنا');
background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:0;pointer-events:none}
.container{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:30px 16px 40px}
.header{text-align:center;margin-bottom:30px}
.title{font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,#fff,#666);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
.sub{color:#666;font-size:.9rem;margin-top:6px}
.search-box{display:flex;gap:10px;max-width:700px;margin:0 auto 24px;background:#0d0d0d;border:1px solid #222;border-radius:60px;padding:6px 6px 6px 20px;align-items:center;transition:0.3s}
.search-box:focus-within{border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,0.1)}
.search-box i{color:#555;font-size:1.1rem}
.search-box input{flex:1;background:transparent;border:none;color:#fff;font-size:1rem;padding:12px;font-family:'Tajawal',sans-serif;outline:none;text-align:right}
.search-box input::placeholder{color:#444}
.search-box button{background:#fff;color:#000;border:none;border-radius:50px;padding:12px 28px;font-weight:900;cursor:pointer;font-family:'Tajawal',sans-serif;transition:0.3s}
.search-box button:hover{background:#ccc}
.search-box button:disabled{opacity:0.5;cursor:not-allowed}
.quick-tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tag{background:#0d0d0d;border:1px solid #222;color:#888;padding:6px 16px;border-radius:50px;font-size:.8rem;font-weight:700;cursor:pointer;transition:0.3s;font-family:'Tajawal',sans-serif}
.tag:hover{color:#fff;border-color:#fff}
.stats{display:flex;justify-content:center;gap:24px;margin-bottom:20px;flex-wrap:wrap;color:#666;font-size:.85rem}
.stats span{color:#fff;font-weight:800}
.loader{text-align:center;padding:60px 20px;color:#666}
.loader .spinner{width:40px;height:40px;border:3px solid #1a1a1a;border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:#0a0a0a;border:1px solid #1a1a1a;border-radius:20px;overflow:hidden;transition:0.3s;cursor:pointer}
.card:hover{border-color:#fff;transform:translateY(-5px);box-shadow:0 12px 30px rgba(255,255,255,0.1)}
.card-img{width:100%;height:160px;object-fit:cover;background:#111;display:block}
.card-body{padding:16px}
.card-name{font-size:1rem;font-weight:900;color:#fff;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-game{font-size:.78rem;color:#888;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-game i{color:#fff;margin-left:4px}
.card-meta{display:flex;justify-content:space-between;font-size:.7rem;color:#555;margin-bottom:12px}
.card-meta span i{color:#888;margin-left:3px}
.card-btn{width:100%;padding:10px;border:none;border-radius:12px;background:#fff;color:#000;font-weight:900;font-size:.85rem;cursor:pointer;font-family:'Tajawal',sans-serif;transition:0.3s}
.card-btn:hover{background:#ccc}
.empty{text-align:center;padding:60px 20px;color:#444;grid-column:1/-1}
.empty i{font-size:4rem;display:block;margin-bottom:16px;color:#222}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal-box{background:#0a0a0a;border:1px solid #222;border-radius:24px;padding:24px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:16px;left:16px;background:#111;border:1px solid #222;color:#888;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;transition:0.3s}
.modal-close:hover{color:#fff;border-color:#fff}
.modal-title{font-size:1.3rem;font-weight:900;color:#fff;margin-bottom:6px;padding-left:40px}
.modal-game{color:#888;font-size:.85rem;margin-bottom:14px}
.modal-img{width:100%;max-height:200px;object-fit:cover;border-radius:14px;margin-bottom:14px;border:1px solid #1a1a1a}
.code-box{background:#000;border:1px solid #1a1a1a;border-radius:14px;padding:14px;font-family:'Courier New',monospace;font-size:.72rem;color:#ccc;direction:ltr;text-align:left;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto;margin-bottom:14px}
.modal-actions{display:flex;gap:10px;flex-wrap:wrap}
.copy-btn{flex:1;padding:12px;border:none;border-radius:14px;background:#fff;color:#000;font-weight:900;font-size:.9rem;cursor:pointer;font-family:'Tajawal',sans-serif;transition:0.3s}
.copy-btn:hover{background:#ccc}
.close-btn{flex:1;padding:12px;border:1px solid #222;border-radius:14px;background:transparent;color:#fff;font-weight:900;font-size:.9rem;cursor:pointer;font-family:'Tajawal',sans-serif;transition:0.3s}
.close-btn:hover{background:#111}
.pagination{display:flex;justify-content:center;gap:10px;margin-top:30px;flex-wrap:wrap}
.page-btn{background:#0d0d0d;border:1px solid #222;color:#888;padding:10px 20px;border-radius:50px;font-weight:800;cursor:pointer;font-family:'Tajawal',sans-serif;transition:0.3s;font-size:.85rem}
.page-btn:hover:not(:disabled){color:#fff;border-color:#fff}
.page-btn:disabled{opacity:0.3;cursor:not-allowed}
.page-info{color:#666;font-size:.85rem;padding:10px 16px}
.footer{text-align:center;color:#333;font-size:.7rem;padding:24px 0 0;border-top:1px solid #111;margin-top:40px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:#000}
::-webkit-scrollbar-thumb{background:#333;border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:#555}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="container">
<div class="header">
<div class="title">MRX · بحث سكربتات</div>
<div class="sub">ابحث عن أي سكربت روبلكس عبر ScriptBlox</div>
</div>

<div class="search-box">
<i class="fa-solid fa-magnifying-glass"></i>
<input type="text" id="searchInput" placeholder="اكتب اسم السكربت أو اسم الماب..." onkeydown="if(event.key==='Enter')doSearch()">
<button id="searchBtn" onclick="doSearch()">بحث</button>
</div>

<div class="quick-tags">
<button class="tag" onclick="quickSearch('Blox Fruits')">Blox Fruits</button>
<button class="tag" onclick="quickSearch('Pet Simulator')">Pet Sim</button>
<button class="tag" onclick="quickSearch('Arsenal')">Arsenal</button>
<button class="tag" onclick="quickSearch('Doors')">Doors</button>
<button class="tag" onclick="quickSearch('Murder Mystery')">MM2</button>
<button class="tag" onclick="quickSearch('Jailbreak')">Jailbreak</button>
</div>

<div class="stats">
<span>🔍 النتائج: <span id="countResult">0</span></span>
<span>📄 الصفحة: <span id="pageNum">1</span></span>
</div>

<div id="resultsContainer">
<div class="empty">
<i class="fa-solid fa-magnifying-glass"></i>
اكتب اسم سكربت أو ماب واضغط بحث
</div>
</div>

<div class="pagination" id="pagination" style="display:none">
<button class="page-btn" id="prevBtn" onclick="changePage(-1)">← السابق</button>
<span class="page-info" id="pageInfo">صفحة 1</span>
<button class="page-btn" id="nextBtn" onclick="changePage(1)">التالي →</button>
</div>

<div class="footer">© MRX 2026 — Powered by ScriptBlox API</div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-box" onclick="event.stopPropagation()">
<button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
<div class="modal-title" id="mTitle">—</div>
<div class="modal-game" id="mGame">—</div>
<img id="mImg" class="modal-img" src="" style="display:none;">
<div class="code-box" id="mCode">—</div>
<div class="modal-actions">
<button class="copy-btn" onclick="copyCode()"><i class="fa-solid fa-copy"></i> نسخ الكود</button>
<button class="close-btn" onclick="closeModal()">إغلاق</button>
</div>
</div>
</div>

<script>
const API_BASE = 'https://scriptblox.com/api/script/search';
let currentPage = 1;
let currentQuery = '';
let currentCode = '';
let totalPages = 1;

async function doSearch() {
    const q = document.getElementById('searchInput').value.trim();
    if (!q) return;
    currentQuery = q;
    currentPage = 1;
    await fetchScripts();
}

async function quickSearch(q) {
    document.getElementById('searchInput').value = q;
    currentQuery = q;
    currentPage = 1;
    await fetchScripts();
}

async function changePage(delta) {
    const newPage = currentPage + delta;
    if (newPage < 1 || newPage > totalPages) return;
    currentPage = newPage;
    await fetchScripts();
}

async function fetchScripts() {
    const container = document.getElementById('resultsContainer');
    container.innerHTML = '<div class="loader"><div class="spinner"></div>جاري البحث...</div>';
    document.getElementById('searchBtn').disabled = true;
    document.getElementById('pagination').style.display = 'none';

    try {
        const url = API_BASE + '?q=' + encodeURIComponent(currentQuery) + '&page=' + currentPage;
        const res = await fetch(url);
        if (!res.ok) throw new Error('فشل الاتصال بالـ API');
        const data = await res.json();

        const scripts = (data.result && data.result.scripts) ? data.result.scripts : [];
        totalPages = (data.result && data.result.totalPages) ? data.result.totalPages : 1;

        document.getElementById('countResult').textContent = scripts.length;
        document.getElementById('pageNum').textContent = currentPage;

        if (scripts.length === 0) {
            container.innerHTML = '<div class="empty"><i class="fa-solid fa-inbox"></i>لا توجد نتائج</div>';
            document.getElementById('searchBtn').disabled = false;
            return;
        }

        renderScripts(scripts);
        renderPagination();
    } catch (e) {
        container.innerHTML = '<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i>حدث خطأ: ' + e.message + '</div>';
    }
    document.getElementById('searchBtn').disabled = false;
}

function renderScripts(scripts) {
    const container = document.getElementById('resultsContainer');
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.innerHTML = '';

    scripts.forEach(function(s) {
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = function() { openModal(s); };

        const img = s.image || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22300%22%3E%3Crect width=%22600%22 height=%22300%22 fill=%22%23111%22/%3E%3Ctext x=%22300%22 y=%22150%22 text-anchor=%22middle%22 fill=%22%23555%22 font-size=%2230%22%3E📜%3C/text%3E%3C/svg%3E';
        const name = escapeHtml(s.title || 'بدون اسم');
        const game = escapeHtml(s.game && s.game.name ? s.game.name : 'غير محدد');
        const views = s.views || 0;
        const verified = s.verified ? 'موثّق ✅' : 'عادي';
        const scriptType = s.scriptType || 'free';

        card.innerHTML =
            '<img class="card-img" src="' + img + '" alt="' + name + '" onerror="this.src=\'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22300%22%3E%3Crect width=%22600%22 height=%22300%22 fill=%22%23111%22/%3E%3Ctext x=%22300%22 y=%22150%22 text-anchor=%22middle%22 fill=%22%23555%22 font-size=%2230%22%3E📜%3C/text%3E%3C/svg%3E\'">' +
            '<div class="card-body">' +
            '<div class="card-name">' + name + '</div>' +
            '<div class="card-game"><i class="fa-solid fa-map-location-dot"></i> ' + game + '</div>' +
            '<div class="card-meta"><span><i class="fa-solid fa-eye"></i> ' + views + '</span><span>' + verified + '</span></div>' +
            '<button class="card-btn"><i class="fa-solid fa-eye"></i> عرض الكود</button>' +
            '</div>';

        grid.appendChild(card);
    });

    container.innerHTML = '';
    container.appendChild(grid);
}

function renderPagination() {
    const pag = document.getElementById('pagination');
    if (totalPages > 1) {
        pag.style.display = 'flex';
        document.getElementById('prevBtn').disabled = currentPage <= 1;
        document.getElementById('nextBtn').disabled = currentPage >= totalPages;
        document.getElementById('pageInfo').textContent = 'صفحة ' + currentPage + ' من ' + totalPages;
    } else {
        pag.style.display = 'none';
    }
}

function openModal(s) {
    currentCode = s.script || 'لا يوجد كود';
    document.getElementById('mTitle').textContent = s.title || 'بدون اسم';
    document.getElementById('mGame').innerHTML = '<i class="fa-solid fa-map-location-dot"></i> ' + escapeHtml(s.game && s.game.name ? s.game.name : 'غير محدد');
    document.getElementById('mCode').textContent = currentCode;

    const img = document.getElementById('mImg');
    if (s.image) {
        img.src = s.image;
        img.style.display = 'block';
    } else {
        img.style.display = 'none';
    }

    document.getElementById('modal').classList.add('open');
}

function closeModal() {
    document.getElementById('modal').classList.remove('open');
}

function copyCode() {
    if (!currentCode) return;
    navigator.clipboard.writeText(currentCode).then(function() {
        alert('✅ تم نسخ الكود');
    }).catch(function() {
        const ta = document.createElement('textarea');
        ta.value = currentCode;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        alert('✅ تم نسخ الكود');
    });
}

function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
}

document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
    }
});
</script>
</body>
</html>
