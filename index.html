<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحلل الذكي الخارق - الإصدار الفائق</title>
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: #111827;
            --accent-color: #00ff66;
            --text-color: #ffffff;
            --danger-color: #ff3366;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.3);
        }

        .main-box {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            border: 1px solid #1f2937;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #080c14;
            border: 2px solid #1f2937;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
            outline: none;
        }

        button {
            background: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #00cc52;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .btn-danger {
            background: var(--danger-color);
            color: white;
        }
        .btn-danger:hover { background: #cc0044; }

        video {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            background: #000;
            margin-top: 15px;
        }

        .gallery-title {
            margin-top: 30px;
            color: var(--accent-color);
            border-bottom: 2px solid #1f2937;
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .img-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #1f2937;
            transition: transform 0.2s;
        }

        .img-card:hover {
            transform: translateY(-5px);
        }

        .img-card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            display: block;
            background: #000;
            cursor: pointer;
        }

        .card-details {
            padding: 15px;
            font-size: 14px;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .card-actions button {
            flex: 1;
            padding: 8px;
            font-size: 12px;
            border-radius: 5px;
        }

        .btn-raw {
            background: #3388ff;
            color: white;
        }
        .btn-raw:hover { background: #1e70e6; }

        /* نافذة العرض بكامل الشاشة الذكية */
        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85%;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 50px;
            color: #fff;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }

        .lightbox-close:hover {
            color: var(--danger-color);
        }

        .url-preview-box {
            text-align: center;
            padding: 20px;
            background: #080c14;
            border-radius: 10px;
            margin-top: 15px;
        }

        .url-preview-box img {
            max-width: 100%;
            max-height: 300px;
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>النظام الخارق لتحليل اللقطات والروابط الفورية</h1>

    <div class="main-box">
        <h3>1. نظام سحب الفيديو ورصد اللقطات حبة حبة (تتبع ذكي)</h3>
        <input type="file" id="videoInput" accept="video/*">
        <video id="mainVideo" controls style="display:none;"></video>
        <canvas id="conversionCanvas" style="display:none;"></canvas>
    </div>

    <div class="main-box">
        <h3>2. مستخرج الصور الفوري من الروابط</h3>
        <input type="text" id="urlInput" placeholder="ضع رابط الصورة هنا...">
        <button onclick="fetchImageFromUrl()">استخراج ومعاينة الصورة</button>
        
        <div id="urlPreviewArea" class="url-preview-box" style="display: none;">
            <h4>الصورة المستخرجة (اضغط عليها للتكبير):</h4>
            <img id="previewTarget" src="" alt="المعاينة" onclick="openLightbox(this.src)">
            <div style="margin-top: 15px;">
                <button onclick="downloadSingleImage(document.getElementById('previewTarget').src, 'url-photo.png')">حفظ في ألبوم الصور مباشرة</button>
            </div>
        </div>
    </div>

    <div class="gallery-title">
        <h2>اللقطات المرصودة بالتفصيل حبة حبة</h2>
        <button class="btn-danger" id="downloadAllBtn" style="display:none;" onclick="downloadAllImages()">حفظ كل الصور في ألبوم جهازك</button>
    </div>

    <div class="grid-container" id="gallery"></div>
</div>

<div id="customLightbox" class="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    <img id="lightboxImg" src="" alt="عرض كبير">
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const video = document.getElementById('mainVideo');
    const canvas = document.getElementById('conversionCanvas');
    const ctx = canvas.getContext('2d');
    const gallery = document.getElementById('gallery');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const lightbox = document.getElementById('customLightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    let processedImages = [];
    let lastFrameData = null;

    videoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        video.src = URL.createObjectURL(file);
        video.style.display = 'block';
        gallery.innerHTML = '';
        processedImages = [];
        downloadAllBtn.style.display = 'none';
        
        video.onloadedmetadata = function() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            extractFrames();
        };
    });

    // دالة رصد اللقطات حبة حبة مع رصد الانتقال والتشويش التدريجي
    async function extractFrames() {
        let duration = video.duration;
        let currentTime = 0;
        let step = 0.4; // رصد عالي الدقة (أقل من نصف ثانية) عشان يلحق اللقطات حبة حبة قبل ما تنتقل

        let count = 1;
        while (currentTime < duration) {
            video.currentTime = currentTime;
            await new Promise(r => video.onseeked = r);

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            let frameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            // رصد التشويش التدريجي بين اللقطات الانتقالية
            if (isFrameBlurryOrNoise(frameData)) {
                currentTime += step;
                continue; 
            }

            let dataUrl = canvas.toDataURL('image/png');
            processedImages.push({ src: dataUrl, time: currentTime.toFixed(2), index: count });

            createCard(dataUrl, currentTime.toFixed(2), count);
            count++;
            currentTime += step; 
        }

        if(processedImages.length > 0) {
            downloadAllBtn.style.display = 'block';
        }
    }

    function isFrameBlurryOrNoise(currentFrame) {
        if (!lastFrameData) {
            lastFrameData = currentFrame;
            return false;
        }
        let data1 = lastFrameData.data;
        let data2 = currentFrame.data;
        let diff = 0;
        for (let i = 0; i < data1.length; i += 50) {
            diff += Math.abs(data1[i] - data2[i]);
        }
        lastFrameData = currentFrame;
        return diff > 65000000; // حساسية دقيقة لرصد التشويش الفجائي العالي جداً
    }

    // بناء كروت العرض
    function createCard(src, time, count) {
        const card = document.createElement('div');
        card.className = 'img-card';

        // إنشاء رابط الـ RAW المطلوب
        let rawUrl = window.location.origin + `/captured/frame-${count}/time-${time}/raw/`;

        card.innerHTML = `
            <img src="${src}" alt="اللقطة" onclick="openLightbox('${src}')">
            <div class="card-details">
                <strong>اللقطة:</strong> #${count} <br>
                <strong>التوقيت:</strong> ${time} ثانية <br>
                <div class="card-actions">
                    <button onclick="downloadSingleImage('${src}', 'image-${count}.png')">حفظ بالجهاز</button>
                    <button class="btn-raw" onclick="copyRawLink('${rawUrl}')">RAW /</button>
                </div>
            </div>
        `;
        gallery.appendChild(card);
    }

    // دالة نسخ رابط الـ RAW تلقائياً بضغطة زر واحدة
    function copyRawLink(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert("تم نسخ رابط الـ RAW تلقائياً في جهازك:\n" + url);
        }).catch(err => {
            // حل بديل للمتصفحات القديمة
            const el = document.createElement('textarea');
            el.value = url;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("تم نسخ رابط الـ RAW بنجاح!");
        });
    }

    // فتح الصورة بكامل الشاشة
    function openLightbox(src) {
        lightboxImg.src = src;
        lightbox.style.display = 'flex';
    }

    // إغلاق نافذة العرض بزر الـ X
    function closeLightbox() {
        lightbox.style.display = 'none';
        lightboxImg.src = '';
    }

    // دالة تنزل الصور مباشرة للألبوم وبدون استخدام ملفات أو مجلدات مضغوطة
    function downloadSingleImage(src, filename) {
        const link = document.createElement('a');
        link.href = src;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // حفظ كل الصور دفعة واحدة مباشرة في معرض الجهاز وبدون تجميعها بملف واحد
    function downloadAllImages() {
        if(processedImages.length === 0) return;
        processedImages.forEach((img) => {
            downloadSingleImage(img.src, `لقطة-${img.index}-توقيت-${img.time}.png`);
        });
    }

    // جلب الروابط ومعاينتها
    function fetchImageFromUrl() {
        const urlInput = document.getElementById('urlInput').value;
        const previewArea = document.getElementById('urlPreviewArea');
        const previewTarget = document.getElementById('previewTarget');

        if(!urlInput) {
            alert("يرجى إدخال رابط الصورة أولاً!");
            return;
        }
        previewArea.style.display = 'block';
        previewTarget.src = urlInput;
    }
</script>

</body>
</html>
