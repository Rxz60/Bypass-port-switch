<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>MRX Auth Bypass</title>
<style>
body {
    background-color: #000;
    color: #fff;
    font-family: 'Courier New', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}
.container {
    width: 320px;
    padding: 20px;
    text-align: center;
    border: 1px solid #333;
    background: #111;
}
h1 { margin-bottom: 20px; letter-spacing: 3px; }
input {
    width: 90%; padding: 10px; margin-bottom: 15px;
    background: #000; border: 1px solid #444; color: white;
}
button {
    width: 100%; padding: 10px; cursor: pointer;
    border: none; font-weight: bold; margin-bottom: 5px;
}
.btn-action { background: #fff; color: #000; }
.btn-copy { background: #333; color: #ccc; display: none; }
.loader {
    display: none; height: 3px; background: #222; margin-top: 10px; position: relative; overflow: hidden;
}
.loader::after {
    content: ''; position: absolute; left: -50%; width: 50%; height: 100%;
    background: #fff; animation: load 2s infinite linear;
}
@keyframes load { 0% { left: -50%; } 100% { left: 100%; } }
.status { display: none; margin-top: 10px; font-size: 12px; color: #888; min-height: 15px; }
#final-key {
    display: none; margin-top: 15px; padding: 10px;
    background: #000; border: 1px dashed #555; word-break: break-all; color: #0f0;
}
</style>
</head>
<body>

<div class="container">
    <h1>MRX</h1>
    <input type="text" id="linkInput" value="https://auth.platorelay.com/" placeholder="أدخل الرابط هنا...">
    <button class="btn-action" onclick="bypassAuth()">تجاوز الحماية</button>
    
    <div class="loader" id="bar"></div>
    <div class="status" id="msg"></div>
    
    <div id="final-key"></div>
    <button class="btn-copy" id="copyBtn" onclick="copyToClip()">نسخ المفتاح</button>
</div>

<script>
function bypassAuth() {
    document.querySelector('.btn-action').style.display = 'none';
    document.getElementById('bar').style.display = 'block';
    document.getElementById('msg').style.display = 'block';
    
    var steps = [
        "Connecting to auth.platorelay.com...",
        "Fetching API Token...",
        "Bypassing Security Layer...",
        "Extracting Key..."
    ];
    
    var i = 0;
    var intv = setInterval(function() {
        if(i < steps.length) {
            document.getElementById('msg').innerText = steps[i];
            i++;
        } else {
            clearInterval(intv);
            showKey();
        }
    }, 800);
}

function showKey() {
    document.getElementById('bar').style.display = 'none';
    document.getElementById('msg').innerText = "Success";
    
    var keyBox = document.getElementById('final-key');
    var copyBtn = document.getElementById('copyBtn');
    
    keyBox.style.display = 'block';
    keyBox.innerText = "hndr_0c9c3ff3af002e70c4395e9d1b8140c13bd1";
    
    copyBtn.style.display = 'inline-block';
}

function copyToClip() {
    var txt = document.getElementById("final-key").innerText;
    navigator.clipboard.writeText(txt);
    var btn = document.getElementById("copyBtn");
    btn.innerText = "Copied!";
    setTimeout(function(){ btn.innerText = "Copy Key"; }, 2000);
}
</script>

</body>
</html>
